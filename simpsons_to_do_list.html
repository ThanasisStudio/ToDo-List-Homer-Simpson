<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homer's Ultimate Simpsons To-Do List</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Kalam:wght@700&family=Permanent+Marker&family=Luckiest+Guy&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Simpsons Living Room Environment */
        body {
            font-family: 'Kalam', cursive;
            background-color: #f28d35; /* Famous Simpson Orange Living Room Wall */
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Simpsons Floor Pattern */
        .simpson-floor {
            background-color: #c2185b;
            background-image: 
                radial-gradient(#e91e63 20%, transparent 20%),
                radial-gradient(#00bcd4 20%, transparent 20%);
            background-size: 70px 70px;
            background-position: 0 0, 35px 35px;
            border-top: 8px solid #111;
        }

        .font-simpson-title {
            font-family: 'Luckiest Guy', cursive;
            letter-spacing: 2px;
            -webkit-text-stroke: 2px #111;
        }

        .font-marker {
            font-family: 'Permanent Marker', cursive;
        }

        .font-handwriting {
            font-family: 'Caveat', cursive;
        }

        /* Animated Paper & Hands Container */
        .homer-paper-container {
            transition: transform 0.3s ease;
            animation: gentleSway 6s ease-in-out infinite;
        }

        @keyframes gentleSway {
            0%, 100% { transform: rotate(-1deg) translateY(0px); }
            50% { transform: rotate(1deg) translateY(-6px); }
        }

        .homer-paper {
            background: #fffdf0;
            box-shadow: 12px 18px 0px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0,0,0,0.15);
            border: 4px solid #111;
        }

        /* Simpsons Character & Decor Styles */
        .sailboat-picture {
            border: 5px solid #5d4037;
            background: #81d4fa;
            box-shadow: 6px 6px 0px #111;
            transform: rotate(-2deg);
        }

        .tv-frame {
            background: #ab47bc;
            border: 4px solid #111;
            box-shadow: 6px 6px 0px #111;
        }

        .tv-screen {
            background: #111;
            border: 3px solid #111;
        }

        /* Custom Donut Checkbox Style */
        .donut-checkbox {
            width: 42px;
            height: 42px;
            background: #ff69b4;
            border-radius: 50%;
            border: 3px solid #111;
            position: relative;
            cursor: pointer;
            flex-shrink: 0;
            box-shadow: 3px 3px 0px #111;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .donut-checkbox:hover {
            transform: scale(1.1) rotate(15deg);
        }

        /* Donut Hole */
        .donut-checkbox::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 12px;
            height: 12px;
            background: #fffdf0;
            border-radius: 50%;
            border: 2px solid #111;
        }

        /* Sprinkles on donut */
        .donut-sprinkles {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            pointer-events: none;
        }

        /* Eaten Donut Checkbox (Checked State) */
        .donut-checked {
            background: #8bc34a !important;
            transform: scale(0.95);
        }

        .donut-checked::after {
            content: '✓';
            position: absolute;
            top: -12px;
            left: 6px;
            font-family: 'Permanent Marker', cursive;
            font-size: 42px;
            color: #111;
            line-height: 1;
            text-shadow: 2px 2px 0px #fff;
        }

        /* Comic Buttons */
        .comic-btn {
            border: 3px solid #111;
            box-shadow: 4px 4px 0px #111;
            transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .comic-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #111;
        }

        .comic-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #111;
        }

        /* Real Detailed Homer Hands SVG/CSS */
        .homer-hand {
            position: absolute;
            z-index: 25;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .homer-hand-left {
            left: -40px;
            bottom: 15%;
            width: 90px;
            filter: drop-shadow(-4px 4px 0px #111);
        }

        .homer-hand-right {
            right: -40px;
            bottom: 20%;
            width: 90px;
            filter: drop-shadow(4px 4px 0px #111);
        }

        /* Speech Bubble for Homer */
        .speech-bubble {
            position: relative;
            background: #ffffff;
            border: 4px solid #111;
            border-radius: 20px;
            box-shadow: 5px 5px 0px #111;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 30px;
            border-width: 20px 15px 0;
            border-style: solid;
            border-color: #ffffff transparent;
            display: block;
            width: 0;
        }

        .speech-bubble::before {
            content: '';
            position: absolute;
            bottom: -25px;
            left: 28px;
            border-width: 22px 17px 0;
            border-style: solid;
            border-color: #111 transparent;
            display: block;
            width: 0;
        }

        /* Responsive behavior for mobile & tablets */
        @media (max-width: 640px) {
            .homer-hand-left {
                left: -20px;
                bottom: -15px;
                width: 60px;
            }
            .homer-hand-right {
                right: -20px;
                bottom: -10px;
                width: 60px;
            }
            .homer-paper {
                padding: 1.25rem 1rem !important;
            }
        }
    </style>
</head>
<body class="flex flex-col justify-between items-center min-h-screen">

        <!-- The Meme Paper Sheet -->

                <!-- Input Form -->

                    <input

                        id="todo-input"

                <!-- Actions Bar -->

                <!-- Todo List -->
                <ul id="todo-list" class="space-y-2 md:space-y-3 min-h-[160px] max-h-[280px] md:max-h-[320px] overflow-y-auto pr-1">

                <!-- Footer Stats & Reset -->
                <div class="mt-4 md:mt-6 pt-3 md:pt-4 border-t-4 border-black flex justify-between items-center font-bold text-gray-900 flex-wrap gap-2">
                    <span id="items-left" class="font-handwriting text-2xl md:text-3xl text-black">
                        Осталось: 0
                    </span>

                    <div class="flex gap-2 sm:gap-3 text-xs">

                            Вернуть мем

                        <button onclick="clearCompleted()" id="btn-clear-completed" class="underline hover:text-red-600 transition font-extrabold">
                            Очистить готовые

            </div>

    </main>

    <!-- Bottom Carpet Floor & Donut Button Bar -->
    <div class="w-full simpson-floor p-3 md:p-4 flex flex-col sm:flex-row justify-center items-center gap-3 z-20">
        
        <!-- Doughnut Explosion Launcher -->

    <!-- JavaScript App Logic -->
    <script>
        // Translations Dictionary
        const I18N = {
            ru: {

                appSubtitle: "Homer's Simpsons To-Do List",

                speechReset: "Легендарный список Гомера из Симпсонов восстановлен!",
                speechDonut: "Mmmmm... Полноценный салют из пончиков!",
                quotes: [
                    "D'oh!",
                    "Woo-hoo! Задачка готова!",
                    "Ммм... Запретный пончик...",
                    "Работа — это для тех, кто не умеет пить Duff!",
                    "Пытаться — это первый шаг к неудаче.",
                    "Оператор! Дайте мне номер 911!",
                    "Если что-то сложно сделать, значит, это не стоит делать!"
                ],
                ideas: [
                    "Поспать на рабочем месте в секторе 7G",
                    "Заскочить к Мо на кружку Duff",
                    "Съесть розовый пончик с посыпкой",
                    "Поспорить с Недом Фландерсом",
                    "Посмотреть Красти Шоу с детьми",
                    "Купить чипсы и ничего не делать",
                    "Сказать Барту 'Ах ты гадёныш!'"
                ],
                defaultTasks: [
                    { id: '1', text: 'CHECK OUT THAT NEW STORE', completed: true },
                    { id: '2', text: 'FIND, DESTROY ATLANTIS', completed: true },

                ]
            },
            en: {
                appTitle: "HOMER'S TO-DO",
                appSubtitle: "Homer's Simpsons To-Do List",
                subHeaderTag: "Homer's Top Secret Tasks",
                inputPlaceholder: "Type Homer's task...",
                btnRandomIdea: "+ Homer's Idea",
                filterAll: "All",
                filterActive: "Active",
                filterCompleted: "Done",
                itemsLeft: "Left: ",
                btnResetMeme: "Reset Meme",
                btnClearCompleted: "Clear Done",
                btnEatDonut: "EAT A DONUT!",
                emptyActive: "All done! Duff o'clock! 🍺",
                emptyCompleted: "Nothing completed yet! 🍩",
                defaultSpeech: "Mmm... Time to write important stuff! (or just go to Moe's)",
                speechAdded: "Great entry! Hope it has nothing to do with work...",
                speechCompleted: "Woo-hoo! Another task completed!",
                speechDeleted: "D'oh! Threw that task out of my head!",
                speechCleared: "Cleared all completed! Snack time.",
                speechReset: "The legendary Homer meme list restored!",
                speechDonut: "Mmmmm... Full donut fireworks!",
                quotes: [
                    "D'oh!",
                    "Woo-hoo! Task completed!",
                    "Mmm... Forbidden donut...",
                    "Work is for people who don't know how to drink Duff!",
                    "Trying is the first step towards failure.",
                    "Operator! Give me the number for 911!",
                    "If something's hard to do, then it's not worth doing!"
                ],
                ideas: [
                    "Take a nap at sector 7G",
                    "Grab a Duff beer at Moe's Tavern",
                    "Eat a pink sprinkle donut",
                    "Argue with Ned Flanders",
                    "Watch Krusty the Clown with kids",
                    "Buy potato chips and relax",
                    "Choke Bart: 'Why you little...!'"
                ],
                defaultTasks: [
                    { id: '1', text: 'CHECK OUT THAT NEW STORE', completed: true },
                    { id: '2', text: 'FIND, DESTROY ATLANTIS', completed: true },
                    { id: '3', text: 'FAKE INTEREST IN SON', completed: false }
                ]
            }
        };

        const TV_CHANNELS = [
            "📺 KRUSTY SHOW",
            "🐭 ITCHY & SCRATCHY",
            "☢️ NUCLEAR PLANT",
            "🍺 DUFF BEER AD",
            "NEWS: KENT O'MAN"
        ];

        // Current Language & State
        let currentLang = localStorage.getItem('homer_app_lang') || 'ru';
        let todos = JSON.parse(localStorage.getItem('simpsons_homer_todos')) || I18N[currentLang].defaultTasks;
        let currentFilter = 'all';
        let donutEatenCount = parseInt(localStorage.getItem('homer_donut_count') || '0');
        let currentTvIndex = 0;

        // DOM elements
        const todoForm = document.getElementById('todo-form');
        const todoInput = document.getElementById('todo-input');
        const todoList = document.getElementById('todo-list');
        const itemsLeft = document.getElementById('items-left');
        const homerSpeech = document.getElementById('homer-speech');
        const homerAvatar = document.getElementById('homer-avatar');
        const donutCounter = document.getElementById('donut-counter');

        // Web Audio Synthesizer
        const playSimpsonsSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'add') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.25, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.15);
                } else if (type === 'eat') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(80, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.1);
                } else if (type === 'doh') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(400, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.25);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.25);
                } else if (type === 'tv') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(800, ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.08);
                }
            } catch (e) {}
        };

        // Switch App Language
        window.setLanguage = (lang) => {
            currentLang = lang;
            localStorage.setItem('homer_app_lang', lang);

            // Update UI elements
            const t = I18N[lang];
            document.getElementById('app-title').textContent = t.appTitle;
            document.getElementById('app-subtitle').textContent = t.appSubtitle;
            document.getElementById('sub-header-tag').children[1].textContent = t.subHeaderTag;
            todoInput.placeholder = t.inputPlaceholder;
            document.getElementById('btn-random-idea').textContent = t.btnRandomIdea;
            document.getElementById('filter-all').textContent = t.filterAll;
            document.getElementById('filter-active').textContent = t.filterActive;
            document.getElementById('filter-completed').textContent = t.filterCompleted;
            document.getElementById('btn-reset-meme').textContent = t.btnResetMeme;
            document.getElementById('btn-clear-completed').textContent = t.btnClearCompleted;
            document.getElementById('btn-eat-donut').textContent = t.btnEatDonut;
            updateHomerSpeech(t.defaultSpeech);

            // Toggle active lang buttons
            document.getElementById('lang-ru-btn').className = `px-2 py-1 text-xs font-black rounded-lg transition ${lang === 'ru' ? 'bg-yellow-400 border-2 border-black' : 'hover:bg-yellow-100'}`;
            document.getElementById('lang-en-btn').className = `px-2 py-1 text-xs font-black rounded-lg transition ${lang === 'en' ? 'bg-yellow-400 border-2 border-black' : 'hover:bg-yellow-100'}`;

            render();
        };

        // Render Todo List
        function render() {
            todoList.innerHTML = '';
            donutCounter.textContent = donutEatenCount;
            const t = I18N[currentLang];

            const filtered = todos.filter(todo => {
                if (currentFilter === 'active') return !todo.completed;
                if (currentFilter === 'completed') return todo.completed;
                return true;
            });

            if (filtered.length === 0) {
                todoList.innerHTML = `
                    <li class="text-center py-6 md:py-8 font-handwriting text-2xl md:text-3xl text-gray-500">
                        ${currentFilter === 'completed' ? t.emptyCompleted : t.emptyActive}
                    </li>
                `;
            } else {
                filtered.forEach(todo => {
                    const li = document.createElement('li');
                    li.className = 'todo-item-enter flex items-center justify-between gap-2 md:gap-3 p-1.5 md:p-2 border-b-2 border-dashed border-gray-400 hover:bg-yellow-100/40 rounded-lg transition';

                    li.innerHTML = `
                        <div class="flex items-center gap-2.5 md:gap-3 flex-1 cursor-pointer select-none" onclick="toggleTodo('${todo.id}')">
                            <div class="donut-checkbox ${todo.completed ? 'donut-checked' : ''}" title="Toggle">
                                <div class="donut-sprinkles"></div>
                            </div>
                            <span class="font-handwriting text-xl sm:text-2xl md:text-3xl font-extrabold leading-tight tracking-wide ${todo.completed ? 'line-through text-gray-500 opacity-70' : 'text-black'}">
                                ${escapeHtml(todo.text)}
                            </span>
                        </div>
                        <button 
                            onclick="deleteTodo('${todo.id}')"
                            class="text-gray-400 hover:text-red-600 p-1.5 md:p-2 transition text-lg md:text-xl"
                            title="Delete"
                        >
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    `;
                    todoList.appendChild(li);
                });
            }

            // Counter
            const activeCount = todos.filter(t => !t.completed).length;
            itemsLeft.textContent = `${t.itemsLeft}${activeCount}`;

            // Save
            localStorage.setItem('simpsons_homer_todos', JSON.stringify(todos));
            localStorage.setItem('homer_donut_count', donutEatenCount.toString());
        }

        // Add Todo
        todoForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = todoInput.value.trim();
            if (!text) return;

            todos.push({
                id: Date.now().toString(),
                text: text,
                completed: false
            });

            todoInput.value = '';
            playSimpsonsSound('add');
            updateHomerSpeech(I18N[currentLang].speechAdded);
            homerAvatar.textContent = '✏️';
            render();
        });

        // Add Random Idea
        window.addRandomHomerTask = () => {
            const ideas = I18N[currentLang].ideas;
            const randomIdea = ideas[Math.floor(Math.random() * ideas.length)];
            todos.push({
                id: Date.now().toString(),
                text: randomIdea,
                completed: false
            });
            playSimpsonsSound('add');
            updateHomerSpeech(`"${randomIdea}"`);
            homerAvatar.textContent = '💡';
            render();
        };

        // Toggle Todo
        window.toggleTodo = (id) => {
            todos = todos.map(t => {
                if (t.id === id) {
                    const nextState = !t.completed;
                    if (nextState) {
                        playSimpsonsSound('eat');
                        donutEatenCount++;
                        updateHomerSpeech(I18N[currentLang].speechCompleted);
                        homerAvatar.textContent = '🍩';
                    } else {
                        playSimpsonsSound('add');
                    }
                    return { ...t, completed: nextState };
                }
                return t;
            });
            render();
        };

        // Delete Todo
        window.deleteTodo = (id) => {
            todos = todos.filter(t => t.id !== id);
            playSimpsonsSound('doh');
            updateHomerSpeech(I18N[currentLang].speechDeleted);
            homerAvatar.textContent = '😱';
            render();
        };

        // Clear Completed
        window.clearCompleted = () => {
            todos = todos.filter(t => !t.completed);
            playSimpsonsSound('doh');
            updateHomerSpeech(I18N[currentLang].speechCleared);
            render();
        };

        // Reset
        window.resetToDefault = () => {
            todos = JSON.parse(JSON.stringify(I18N[currentLang].defaultTasks));
            playSimpsonsSound('add');
            updateHomerSpeech(I18N[currentLang].speechReset);
            homerAvatar.textContent = '📜';
            render();
        };

        // Set Filter
        window.setFilter = (filter) => {
            currentFilter = filter;
            ['all', 'active', 'completed'].forEach(f => {
                const btn = document.getElementById(`filter-${f}`);
                if (f === filter) {
                    btn.className = 'px-2.5 py-1.5 rounded-lg border-2 border-black bg-yellow-400';
                } else {
                    btn.className = 'px-2.5 py-1.5 rounded-lg border-2 border-black bg-white';
                }
            });
            render();
        };

        // Trigger Random Homer Reaction
        window.triggerHomerReaction = () => {
            const quotes = I18N[currentLang].quotes;
            const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
            playSimpsonsSound('doh');
            updateHomerSpeech(`"${randomQuote}"`);
            homerAvatar.textContent = ['🤪', '🍺', '🍩', '🤤', '🥴'][Math.floor(Math.random() * 5)];
        };

        // Speech Bubble helper
        function updateHomerSpeech(text) {
            homerSpeech.textContent = text;
        }

        // Switch TV Decor Channel
        window.switchTVChannel = () => {
            playSimpsonsSound('tv');
            currentTvIndex = (currentTvIndex + 1) % TV_CHANNELS.length;
            document.getElementById('tv-screen').innerHTML = `<span class="text-yellow-300 animate-pulse">${TV_CHANNELS[currentTvIndex]}</span>`;
        };

        // Donut Confetti Fireworks
        window.launchDonutConfetti = () => {
            playSimpsonsSound('eat');
            donutEatenCount += 5;
            render();
            updateHomerSpeech(I18N[currentLang].speechDonut);
            homerAvatar.textContent = '🤤';

            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 50,
                    spread: 70,
                    origin: { y: 0.8 },
                    colors: ['#ff69b4', '#ffd90f', '#00bcd4', '#8bc34a']
                });
            }
        };

        // Escape HTML
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // Initialize Language & Render
        setLanguage(currentLang);
    </script>
</body>
</html>
